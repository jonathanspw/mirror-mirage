name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-flight runs for the same PR/branch when new commits arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (with test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run pytest
        run: pytest -v

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  typecheck:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (with dev extras for mypy stubs)
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: mypy
        run: mypy src

  rpm:
    name: rpmlint + SRPM build
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v6
      - name: Install RPM tooling
        run: |
          dnf -y install \
            rpmlint rpm-build rpmdevtools tar \
            python3-devel pyproject-rpm-macros systemd-rpm-macros
      - name: rpmlint the spec
        run: rpmlint packaging/mirror-mirage.spec
      - name: Build SRPM
        run: |
          rpmdev-setuptree
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tar --transform "s,^,mirror-mirage-${VERSION}/," \
            -czf ~/rpmbuild/SOURCES/mirror-mirage-${VERSION}.tar.gz \
            --exclude=.git --exclude=__pycache__ --exclude='*.egg-info' --exclude='.venv' \
            .
          rpmbuild -bs packaging/mirror-mirage.spec
      - name: Upload SRPM
        uses: actions/upload-artifact@v7
        with:
          name: srpm
          path: /github/home/rpmbuild/SRPMS/*.src.rpm
          if-no-files-found: error
