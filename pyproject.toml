[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-mirage"
version = "0.1.0"
description = "Inotify-driven CDN cache-flush daemon for filesystem mirrors"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "AlmaLinux OS Foundation" }]
dependencies = [
    "asyncinotify>=4.0",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "boto3>=1.34",
    "google-auth>=2.28",
    "requests>=2.31",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
journald = ["systemd-python>=235"]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.20",
]
dev = [
    "mirror-mirage[test]",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
mirror-mirage = "mirror_mirage.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mirror_mirage"]

# Third-party libraries without published type stubs. boto3/botocore
# don't ship a py.typed marker; google-auth is partially typed but its
# service_account helpers aren't. Treating them as Any avoids spurious
# errors without disabling strict mode for the rest of the codebase.
[[tool.mypy.overrides]]
module = [
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
    "google.auth.*",
    "google.oauth2.*",
]
ignore_missing_imports = true
