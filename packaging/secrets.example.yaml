# Mirror Mirage CDN flush daemon — example credentials file.
# Install at /etc/mirror-mirage/secrets.yaml, chmod 0600,
# chown mirror-mirage:mirror-mirage. The daemon will refuse to start if
# any group or world bits are set.
#
# The top-level keys here MUST match the CDN names declared in config.yaml.

fastly_main:
  api_token: "fxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

cloudfront_us:
  access_key_id: "AKIAxxxxxxxxxxxxxxxx"
  secret_access_key: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

gcp_eu:
  # Path to a Google service-account JSON file with the
  # roles/compute.loadBalancerAdmin (or compute.networkAdmin) role on
  # the target project. Mirror Mirage reads this file; it is not stored
  # inline.
  service_account_file: /etc/mirror-mirage/gcp-sa.json
